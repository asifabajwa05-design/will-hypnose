# ÄNDERE den Namen: muss weltweit einmalig sein, z. B. "fitness-familie-mueller"
app = "familien-fitness-CHANGEME"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "fitness_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
